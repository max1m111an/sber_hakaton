services:
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-8080}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./database:/app/database
    networks:
      - app_network

  postgres:
    image: postgres
    container_name: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    command: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080

  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx
  #   restart: always
  #   depends_on:
  #     - fastapi
  #   ports:
  #     - 80:80
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
  qdrant_storage: