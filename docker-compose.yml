services:
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${API_PORT:-8080}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    env_file:
      - .env
    environment:
      # внутри docker-сети БД доступна по имени сервиса и внутреннему порту
      DB_HOST: postgres
      DB_PORT: 5432
      # выгрузка каталога: при пустой БД загружается автоматически при старте
      PRODUCTS_FILE: /app/data/products_final.json
      AUTO_IMPORT: "true"
      # ML-матчинг: обучается в фоне после импорта; в подбор идут товары с уверенностью ≥ порога
      ML_AUTO_TRAIN: "true"
      ML_CONFIDENCE_THRESHOLD: "0.8"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./database:/app/database
      - ./ml:/app/ml
      # обученный классификатор и кеш эмбеддингов переживают пересборку контейнера
      - ml_artifacts:/app/ml_artifacts
      - ./products_final.json:/app/data/products_final.json:ro
    networks:
      - app_network

  postgres:
    image: postgres
    container_name: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # данные БД переживают docker compose down (но не down -v)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "${QDRANT_PORT}:6333" # HTTP API
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${DB_PASS}
      - REDIS_USER=${DB_USER}
      - REDIS_USER_PASSWORD=${DB_PASS}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $DB_PASS" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $DB_USER on >$DB_PASS ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$DB_PASS", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - app_network

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${OLLAMA_PORT}:11434"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    expose:
      - 80
    networks:
      - app_network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    env_file:
      - .env
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    env_file:
      - .env
    depends_on:
      - fastapi
      - frontend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
  ml_artifacts:
  qdrant_storage:
